# Release on a v* tag: the aggregator for linux/darwin x amd64/arm64 through
# GoReleaser, the phone APK through Gradle, all attached to a GitHub Release
# with generated notes and one checksums.txt. Needs no secrets: without the
# optional keystore secrets the APK is signed with the runner's throwaway
# debug key and named *_debug-signed.apk.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    env:
      # Optional: base64 of a keystore, plus its passwords and alias. Set all
      # four to get an APK signed with your own key (OTA-compatible with the
      # phone it is already on); leave them unset for a debug-signed APK.
      SCOUTER_KEYSTORE_BASE64: ${{ secrets.SCOUTER_KEYSTORE_BASE64 }}
      SCOUTER_KEYSTORE_PASSWORD: ${{ secrets.SCOUTER_KEYSTORE_PASSWORD }}
      SCOUTER_KEY_ALIAS: ${{ secrets.SCOUTER_KEY_ALIAS }}
      SCOUTER_KEY_PASSWORD: ${{ secrets.SCOUTER_KEY_PASSWORD }}
    steps:
      - name: Check out
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Tag must match the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "v$name" = "$TAG" || { echo "tag $TAG but android/app/build.gradle.kts says versionName $name"; exit 1; }

      - name: Set up JDK
        # actions/setup-java v6.0.1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - name: Keystore from secrets (if set)
        if: env.SCOUTER_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SCOUTER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SCOUTER_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "APK_SUFFIX=" >> "$GITHUB_ENV"

      - name: Debug key (no keystore secrets)
        if: env.SCOUTER_KEYSTORE_BASE64 == ''
        run: echo "APK_SUFFIX=_debug-signed" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/scouter-app_${TAG#v}${APK_SUFFIX}.apk"
          ls -l "$RUNNER_TEMP/apk"

      - name: Upload APK
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        # actions/setup-go v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: aggregator/go.mod
          cache: false

      - name: Download APK
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: apk
          path: apk

      - name: GoReleaser
        # goreleaser/goreleaser-action v7.2.3
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
