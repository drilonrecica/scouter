# Check-only CI for the aggregator. Coolify builds the Dockerfile itself.
name: Aggregator

on:
  push:
    branches: [master]
    paths: ["aggregator/**", ".github/workflows/aggregator.yml"]
  pull_request:
    paths: ["aggregator/**", ".github/workflows/aggregator.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aggregator
    steps:
      - name: Check out
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v5.6.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: aggregator/go.mod

      - name: Lint
        run: make lint

      - name: Test (race detector)
        run: make test-race
